<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGDOM-AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@300;400;600&display=swap');

:root{
--primary:#00f3ff;
--secondary:#0066ff;
--telegram:#229ED9;
--bg-dark:#020205;
--bg-panel:rgba(2,2,5,.95);
--border:rgba(0,243,255,.3);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
background:var(--bg-dark);
color:#fff;
font-family:'Rajdhani',sans-serif;
height:100dvh;
overflow:hidden;
display:flex;
flex-direction:column;
}

/* BACKGROUND GRID */
.grid-bg{
position:fixed;
inset:0;
background:
linear-gradient(90deg,rgba(0,243,255,.03) 1px,transparent 1px),
linear-gradient(rgba(0,243,255,.03) 1px,transparent 1px);
background-size:40px 40px;
z-index:-1;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:var(--bg-panel);
border-bottom:1px solid var(--border);
backdrop-filter:blur(10px);
}

.brand{
font-family:'Orbitron',sans-serif;
color:var(--primary);
letter-spacing:1px;
text-shadow:0 0 10px var(--primary);
}

.header-right{
display:flex;
align-items:center;
gap:12px;
}

/* BUTTONS */
.btn{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:1px solid var(--primary);
background:rgba(0,243,255,.1);
color:var(--primary);
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(0,243,255,.5);
}

.btn svg{
width:20px;
height:20px;
stroke:currentColor;
fill:none;
stroke-width:2;
}

/* TELEGRAM BUTTON */
.telegram-btn{
border-color:var(--telegram);
color:var(--telegram);
background:rgba(34,158,217,.15);
}

.telegram-btn:hover{
background:rgba(34,158,217,.35);
box-shadow:0 0 18px rgba(34,158,217,.7);
}

/* STATUS */
.status-badge{
display:flex;
align-items:center;
gap:6px;
font-size:.75rem;
border:1px solid var(--primary);
padding:4px 8px;
border-radius:4px;
color:var(--primary);
}

.status-dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--primary);
box-shadow:0 0 6px var(--primary);
animation:pulse 2s infinite;
}

/* AVATAR */
.avatar-container{
display:flex;
justify-content:center;
padding:20px 0;
}

.avatar-ring{
width:110px;
height:110px;
border-radius:50%;
border:2px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
position:relative;
animation:breathe 4s infinite;
}

.avatar-ring::before{
content:'';
position:absolute;
inset:-4px;
border:2px dashed var(--secondary);
border-radius:50%;
animation:spin 10s linear infinite;
}

.face{
width:80px;
height:80px;
border-radius:40% 40% 50% 50%;
background:radial-gradient(circle,rgba(0,243,255,.25),#000);
border:1px solid var(--primary);
box-shadow:inset 0 0 20px rgba(0,243,255,.3);
}

/* CHAT */
.chat-area{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:15px;
}

.msg{
max-width:90%;
padding:12px 16px;
border-radius:12px;
font-size:.95rem;
animation:fadeUp .3s ease;
}

.msg.ai{
background:rgba(0,243,255,.08);
border:1px solid var(--border);
align-self:flex-start;
}

.msg.user{
background:rgba(0,102,255,.25);
border:1px solid rgba(0,102,255,.5);
align-self:flex-end;
text-align:right;
}

/* INPUT */
.input-wrapper{
border-top:1px solid var(--border);
background:var(--bg-panel);
padding:10px;
}

.input-container{
display:flex;
gap:10px;
}

.chat-input{
flex:1;
border-radius:25px;
border:1px solid var(--border);
background:rgba(0,0,0,.5);
padding:12px 16px;
color:#fff;
font-size:1rem;
outline:none;
}

.chat-input:focus{
border-color:var(--primary);
box-shadow:0 0 10px rgba(0,243,255,.3);
}

/* ANIMATIONS */
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes breathe{
0%,100%{transform:scale(1)}
50%{transform:scale(1.03)}
}
@keyframes pulse{
0%,100%{opacity:.4}
50%{opacity:1}
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<header>
  <div class="brand">KINGDOM AI</div>

  <div class="header-right">
    <a href="https://t.me/kingdomnetwork" target="_blank" class="btn telegram-btn" title="Join Telegram">
      <svg viewBox="0 0 24 24">
        <path d="M22 2L11 13"></path>
        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
      </svg>
    </a>

    <div class="status-badge">
      <div class="status-dot"></div>
      <span>ONLINE</span>
    </div>
  </div>
</header>

<div class="avatar-container">
  <div class="avatar-ring">
    <div class="face"></div>
  </div>
</div>

<div class="chat-area">
  <div class="msg ai">
    <strong>SYSTEM ONLINE</strong><br>
    Welcome to <strong>KINGDOM AI</strong>.<br>
    Join our Telegram community for updates.
  </div>
</div>

<div class="input-wrapper">
  <div class="input-container">
    <input class="chat-input" placeholder="Command..." />
    <button class="btn">➤</button>
  </div>
</div>

</body>
</html>
